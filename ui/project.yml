name: DIP
options:
  bundleIdPrefix: org.dip-app
  deploymentTarget:
    iOS: "17.0"
packages:
  DIPCore:
    path: Packages/DIPCore
  DIPAccounts:
    path: Packages/DIPAccounts
  DIPContracts:
    path: Packages/DIPContracts
  DIPDesignSystem:
    path: Packages/DIPDesignSystem
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  DIP:
    type: application
    platform: iOS
    sources:
      - path: DIP
        excludes: ["**/*.md"]
    entitlements:
      path: Config/DIP.entitlements
      properties:
        # Google Sign-In stores its session in the keychain; without a keychain group it fails with -34018.
        keychain-access-groups:
          - $(AppIdentifierPrefix)org.dip-app.DIP
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    info:
      path: Config/DIP-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    dependencies:
      - package: DIPContracts
      - package: DIPAccounts
      - package: DIPDesignSystem
      - package: DIPCore
        product: DIPCore
      - package: DIPCore
        product: DIPPresentation
      - package: DIPCore
        product: DIPMockData
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.dip-app.DIP
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  DIPTests:
    type: bundle.unit-test
    platform: iOS
    # Same local signing settings as the app (DEVELOPMENT_TEAM from the gitignored Local.xcconfig).
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: DIPTests
        excludes: ["**/*.md"]
    dependencies:
      - target: DIP
schemes:
  DIP:
    build:
      targets:
        DIP: all
        DIPTests: [test]
    test:
      gatherCoverageData: true
      targets: [DIPTests]
