name: Admin portal
on:
  pull_request:
    paths: ['apps/admin/**', 'firebase.json', '.github/workflows/admin.yml']
  push:
    branches: [main]
    paths: ['apps/admin/**', 'firebase.json', '.github/workflows/admin.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        # Public web-app identifiers (repository variables, not secrets). Without them the build is the
        # mock-mode preview, which must never replace a live-mode deployment.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_APPCHECK_SITE_KEY: ${{ vars.NEXT_PUBLIC_APPCHECK_SITE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: admin-out
          path: apps/admin/out
  deploy:
    # Deploys to Firebase Hosting (site letsdip; team05-dip only redirects) only from main, and only once the
    # FIREBASE_SERVICE_ACCOUNT_TEAM05_DIP repository secret AND the NEXT_PUBLIC_FIREBASE_* repository
    # variables exist, so an automatic deploy can never replace the live portal with the mock.
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEAM05_DIP != '' && vars.NEXT_PUBLIC_FIREBASE_API_KEY != '' && vars.NEXT_PUBLIC_FIREBASE_APP_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_SECRET == 'true'
      - uses: actions/download-artifact@v4
        if: env.HAS_SECRET == 'true'
        with:
          name: admin-out
          path: apps/admin/out
      # EXAMPLE, inactive (owner step, docs/ops/secrets.md section 7): fetch encrypted secrets from the private
      # dip-app/secrets repo instead of storing each value as a GitHub secret. Needs two repository secrets:
      #   SOPS_AGE_KEY            the age PRIVATE key (also kept in the password manager)
      #   DIP_SECRETS_TOKEN       read-only (Contents: read) fine-grained token limited to dip-app/secrets,
      #                           or use DIP_SECRETS_DEPLOY_KEY (read-only deploy key, private half) instead
      # To enable: uncomment, and keep the step after checkout and before the deploy step. Do not echo outputs.
      # - name: Install sops
      #   if: env.HAS_SECRET == 'true'
      #   run: |
      #     curl -sSL -o /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
      #     chmod +x /usr/local/bin/sops
      # - name: Pull public web config from dip-app/secrets
      #   if: env.HAS_SECRET == 'true'
      #   env:
      #     SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      #     DIP_SECRETS_TOKEN: ${{ secrets.DIP_SECRETS_TOKEN }}
      #   run: scripts/secrets/pull.sh --only admin
      # Backend secrets (Secret Manager) are synced by an owner or a manually triggered job, never on push:
      #   run: scripts/secrets/sync-gcp.sh --project team05-dip   (same env as above plus Google credentials)
      - name: Assemble the Hosting root (landing at /, admin at /admin/)
        if: env.HAS_SECRET == 'true'
        run: scripts/build-site.sh --skip-admin-build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_SECRET == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TEAM05_DIP }}
          projectId: team05-dip
          channelId: live
      - name: Skipped
        if: env.HAS_SECRET != 'true'
        run: echo "Skipping the Hosting deploy because FIREBASE_SERVICE_ACCOUNT_TEAM05_DIP and the NEXT_PUBLIC_FIREBASE_* repository variables are not all set."
