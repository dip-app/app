name: DIPFoundationPreview
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  DIPAccounts:
    path: ../Packages/DIPAccounts
  DIPContracts:
    path: ../Packages/DIPContracts
  DIPCore:
    path: ../Packages/DIPCore
  DIPDesignSystem:
    path: ../Packages/DIPDesignSystem
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: ""
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  Preview:
    type: application
    platform: iOS
    sources:
      - App
      - ../DIP/Data/Accounts/PreviewAccountsRepository.swift
      - ../DIP/Domain/Events
      - ../DIP/Domain/Challenges
      - ../DIP/Data/Events/MemberEventAppRepository.swift
      - ../DIP/Features/Foundation/DIPFoundationGallery.swift
      - path: ../DIP/Features
        excludes: ["**/*.md", "Foundation/DIPFoundationGallery.swift"]
    dependencies:
      - package: DIPAccounts
      - package: DIPContracts
      - package: DIPDesignSystem
      - package: DIPCore
        product: DIPCore
      - package: DIPCore
        product: DIPPresentation
      - package: DIPCore
        product: DIPMockData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.dip-app.FoundationPreview
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  PreviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.dip-app.FoundationPreviewUITests
    dependencies:
      - target: Preview
schemes:
  Preview:
    build:
      targets:
        Preview: all
        PreviewUITests: [test]
    test:
      targets: [PreviewUITests]
