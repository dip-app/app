name: DIP
options:
  bundleIdPrefix: work.letsdip
  # English is the source language of every String Catalog (docs/design/ios-i18n.md).
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
packages:
  DIPCore:
    path: Packages/DIPCore
  DIPAccounts:
    path: Packages/DIPAccounts
  DIPContracts:
    path: Packages/DIPContracts
  DIPDesignSystem:
    path: Packages/DIPDesignSystem
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.7
    # Localization (docs/design/ios-i18n.md): String Catalogs, compiler-based extraction of Swift strings.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZED_STRING_SWIFTUI_SUPPORT: YES
targets:
  DIP:
    type: application
    platform: iOS
    sources:
      - path: DIP
        excludes: ["**/*.md"]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    info:
      path: Config/DIP-Info.plist
      properties:
        # HTTPS only (Firebase/Google): exempt, so TestFlight does not ask the export-compliance question per build.
        ITSAppUsesNonExemptEncryption: false
        # Shipped languages (Settings > DIP > Language lists the system-supported ones). tlh is a demo locale.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es, tlh]
        NSCalendarsWriteOnlyAccessUsageDescription: DIP adds activities you choose to your calendar.
        NSCalendarsFullAccessUsageDescription: DIP checks your calendar on this iPhone to warn you when an activity overlaps something you already have. Your calendar never leaves your phone.
        NSPhotoLibraryAddUsageDescription: Save event photos to your library.
        # Push client feature flag (default NO; see docs/design/push-client.md).
        DIPPushEnabled: $(DIP_PUSH_ENABLED)
        # Calendar conflicts feature flag (default NO, Debug YES; see docs/design/stretch/calendar.md).
        DIPCalendarConflictsEnabled: $(DIP_CALENDAR_CONFLICTS_ENABLED)
        # Containment: FCM never starts (no token, no network) unless PushComposition turns it on for the flag.
        FirebaseMessagingAutoInitEnabled: false
        # Launch screen: the DIP mark in brand purple on white (the first app frame is white), instead of a blank page.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
              - dip
    dependencies:
      - package: DIPContracts
      - package: DIPAccounts
      - package: DIPDesignSystem
      - package: DIPCore
        product: DIPCore
      - package: DIPCore
        product: DIPPresentation
      - package: DIPCore
        product: DIPMockData
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: work.letsdip.app
        # iPhone-only for now: an iPad build would need iPad screenshots and all four orientations.
        TARGETED_DEVICE_FAMILY: "1"
        # Free-team builds use the generated Config/DIP.entitlements (no Associated Domains). Paid-team builds set
        # DIP_ENTITLEMENTS = Config/DIP-Paid.entitlements in the untracked Local.xcconfig (docs/design/share-links.md).
        CODE_SIGN_ENTITLEMENTS: $(DIP_ENTITLEMENTS)
  DIPTests:
    type: bundle.unit-test
    platform: iOS
    # Same local signing settings as the app (DEVELOPMENT_TEAM from the gitignored Local.xcconfig).
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: DIPTests
        excludes: ["**/*.md"]
    dependencies:
      - target: DIP
  DIPUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: DIPUITests
        excludes: ["**/*.md"]
    dependencies:
      - target: DIP
schemes:
  DIP:
    build:
      targets:
        DIP: all
        DIPTests: [test]
        DIPUITests: [test]
    test:
      gatherCoverageData: true
      targets: [DIPTests, DIPUITests]
    run:
      # Localization testing (docs/design/ios-i18n.md): tick one in Edit Scheme > Run > Arguments. All off by default.
      commandLineArguments:
        "-AppleLanguages (es)": false
        "-AppleLanguages (tlh)": false
        "-NSDoubleLocalizedStrings YES": false
        "-NSShowNonLocalizedStrings YES": false
