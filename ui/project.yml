name: DIP
options:
  bundleIdPrefix: org.dip-app
  deploymentTarget:
    iOS: "17.0"
packages:
  DIPAccounts:
    path: Packages/DIPAccounts
  DIPContracts:
    path: Packages/DIPContracts
  DIPDesignSystem:
    path: Packages/DIPDesignSystem
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  DIP:
    type: application
    platform: iOS
    sources:
      - path: DIP
        excludes: ["**/*.md"]
    dependencies:
      - package: DIPContracts
      - package: DIPAccounts
      - package: DIPDesignSystem
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.dip-app.DIP
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  DIPTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DIPTests
        excludes: ["**/*.md"]
    dependencies:
      - target: DIP
schemes:
  DIP:
    build:
      targets:
        DIP: all
        DIPTests: [test]
    test:
      gatherCoverageData: true
      targets: [DIPTests]
