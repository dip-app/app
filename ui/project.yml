name: DIP
options:
  bundleIdPrefix: work.letsdip
  deploymentTarget:
    iOS: "17.0"
packages:
  DIPCore:
    path: Packages/DIPCore
  DIPAccounts:
    path: Packages/DIPAccounts
  DIPContracts:
    path: Packages/DIPContracts
  DIPDesignSystem:
    path: Packages/DIPDesignSystem
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  DIP:
    type: application
    platform: iOS
    sources:
      - path: DIP
        excludes: ["**/*.md"]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    info:
      path: Config/DIP-Info.plist
      properties:
        NSCalendarsWriteOnlyAccessUsageDescription: DIP adds activities you choose to your calendar.
        NSPhotoLibraryAddUsageDescription: Save event photos to your library.
        # Push client feature flag (default NO; see docs/design/push-client.md).
        DIPPushEnabled: $(DIP_PUSH_ENABLED)
        # Containment: FCM never starts (no token, no network) unless PushComposition turns it on for the flag.
        FirebaseMessagingAutoInitEnabled: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
              - dip
    dependencies:
      - package: DIPContracts
      - package: DIPAccounts
      - package: DIPDesignSystem
      - package: DIPCore
        product: DIPCore
      - package: DIPCore
        product: DIPPresentation
      - package: DIPCore
        product: DIPMockData
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: work.letsdip.app
        # Free-team builds use the generated Config/DIP.entitlements (no Associated Domains). Paid-team builds set
        # DIP_ENTITLEMENTS = Config/DIP-Paid.entitlements in the untracked Local.xcconfig (docs/design/share-links.md).
        CODE_SIGN_ENTITLEMENTS: $(DIP_ENTITLEMENTS)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  DIPTests:
    type: bundle.unit-test
    platform: iOS
    # Same local signing settings as the app (DEVELOPMENT_TEAM from the gitignored Local.xcconfig).
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: DIPTests
        excludes: ["**/*.md"]
    dependencies:
      - target: DIP
  DIPUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: DIPUITests
        excludes: ["**/*.md"]
    dependencies:
      - target: DIP
schemes:
  DIP:
    build:
      targets:
        DIP: all
        DIPTests: [test]
        DIPUITests: [test]
    test:
      gatherCoverageData: true
      targets: [DIPTests, DIPUITests]
